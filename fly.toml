# Fly.io config for Certificate Fetcher (multi-lab)
#
# The app name here matches the one you already deployed earlier.
# Change if you're deploying a separate instance.

app = "certificate-scrapper"
primary_region = "bom"   # Mumbai. Closer to you and to aglthai.com.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Performance knobs. These defaults give ~4x speedup over v2 and survive
  # transient network hiccups. Only touch these if you see rate-limiting
  # errors (lower CONCURRENCY) or memory pressure (lower CONCURRENCY).
  CONCURRENCY = "4"      # parallel lookups per batch
  LOOKUP_DELAY = "0.3"   # seconds a worker sleeps BEFORE each request
  REQUEST_TIMEOUT = "20" # per-HTTP-call hard timeout
  RETRIES = "3"          # transient failures get retried with backoff
  MAX_ROWS = "2000"      # upped from 1000
  # Tune per-lab column overrides here if your sheet layouts differ:
  # COL_STOCK = "M"
  # AGL_COL_CERT = "AO"
  # AGL_COL_PASSWORD = "DV"
  # IGI_COL_CERT = "AO"
  # HRD_COL_CERT = "AO"
  # GIA_COL_CERT = "AO"
  # MAX_UPLOAD_MB = "10"
  # JOB_TTL_MINUTES = "60"

# Secrets go here via `fly secrets set`, NOT in this file:
#   APP_USER, APP_PASSWORD        login for the whole app
#   HRD_USER, HRD_PASS            only if you implement HRD
#   GIA_API_KEY                   only if you implement GIA

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
